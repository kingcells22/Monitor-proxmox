<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servidores Proxmox</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #222; color: #fff; padding: 10px 20px; }
        .container { margin: 30px auto; width: 400px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px #aaa; }
        .server-list { list-style: none; padding: 0; }
        .server-list li { margin: 15px 0; }
        .server-link { font-size: 1.2em; color: #0077cc; text-decoration: none; }
        .server-link:hover { text-decoration: underline; }
        .logout { float: right; }
    </style>
</head>
<body>
    <div class="header">
        Usuario: <b>{{ user }}</b>
        <span class="logout"><a href="/logout" style="color:#fff;">Cerrar sesión</a></span>
    </div>
    <div class="container">
        <h2>Selecciona un servidor Proxmox</h2>
        {% if error %}
            <div style="color:red;">{{ error }}</div>
        {% endif %}
        <ul class="server-list">
            {% for server in servers %}
            <li>
                <a class="server-link" href="/servers/{{ server.name }}">{{ server.name }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
