<!DOCTYPE html>
<html>
<head>
    <title>Lista de VMs</title>
</head>
<body>
    <h1>Lista de VMs</h1>
    <table border="1">
        <tr>
            <th>VMID</th>
            <th>Nombre</th>
            <th>Status</th>
            <th>Notes</th>
            <th>IPs extraídas</th>
        </tr>
        {% for vm in vms %}
        <tr>
            <td>{{ vm.vmid }}</td>
            <td>{{ vm.name }}</td>
            <td>{{ vm.status }}</td>
            <td>{{ vm.notes }}</td>
            <td>{{ vm.ips }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
